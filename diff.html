<body>

        <span class="logo">InStories</span>
        <nav><a href="index.html">Главная</a><a href="repeats.html">Повторы</a><a href="diff.html" aria-current="page">Сравнение</a></nav>
    </header>
    <main>
        <h1>Сравнение версий</h1>
        <form id="toolForm" onsubmit="return false;">
            <div class="two-col">
                <div>
                    <label for="oldText">Старая версия</label>
                    <textarea id="oldText" placeholder="Вставь сюда прежний текст"></textarea>
                </div>
                <div>
                    <label for="newText">Новая версия</label>
                    <textarea id="newText" placeholder="Вставь сюда новый текст"></textarea>
                </div>
            </div>
            <div class="tool-options">
                <label class="radio-option">
                    <input type="checkbox" id="optOnly"> Показывать только изменения
                </label>
            </div>
            <div class="actions">
                <input type="button" class="primary" value="Сравнить" onclick="compare()" />
                <input type="button" value="Поменять местами" onclick="swapTexts()" />
                <input type="button" value="Очистить" onclick="clearAll()" />
            </div>
            <div id="diffResult" hidden>
                <h2 class="result-title">Что изменилось</h2>
                <p id="diffStats" class="note"></p>
                <div id="diffOut"></div>
            </div>
        </form>
    </main>
